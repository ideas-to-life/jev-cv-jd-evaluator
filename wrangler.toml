name = "jev-evaluator-worker"
main = "src/index.ts"
compatibility_date = "2026-09-21"

[ai]
binding = "AI"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[vars]
PUBLIC_DAILY_LIMIT = "3"
VIP_DAILY_LIMIT = "15"
GLOBAL_DAILY_LIMIT = "250"
VIP_PASSCODE = "COURSE-VIP"

